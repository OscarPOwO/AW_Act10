<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Oscar Pedroza">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaNime - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Racing+Sans+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <header>
        <h1>VaNime</h1>
        <nav>
            <a href="index.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <div class="imagen">
            <img class="opaca" src="images/maki.png" alt="maki">
        </div>

        <div class="formulario">
            <h2>Bienvenido a VaNime!</h2>

            <form action="index.html" method="get">
                <input type="text" name="correo" placeholder="Correo o número" required>
                <br>
                <input type="text" name="nombre" placeholder="Nombre de usuario" required>
                <br>
                <input type="password" name="contrasena" placeholder="Contraseña" required>
                <input class="fecha" type="text" name="dia" placeholder="DD" maxlength="2" required>
                <input class="fecha" type="text" name="mes" placeholder="MM" maxlength="2" required>
                <input class="fecha" type="text" name="anio" placeholder="AA" maxlength="2" required>
                <button type="submit">Registrarme</button>
            </form>
        </div>
    </main>
<footer id="contacto">
    <p>2026 &copy; Pedroza Orozco Oscar</p>
    <div class="redes">
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-youtube"></i></a>
        <a href="#"><i class="bi bi-tiktok"></i></a>
    </div>
</footer>
</body>
</html>
